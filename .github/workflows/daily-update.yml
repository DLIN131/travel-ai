name: Daily Travel Data Update

on:
  schedule:
    # 每天 UTC 時間 00:00 (台灣時間 08:00) 執行
    - cron: '0 0 * * *'
  workflow_dispatch: # 允許手動從 GitHub 網頁端觸發測試

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Cron API
        run: |
          curl -X GET "${{ secrets.RENDER_API_URL }}" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
