version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: travel-ai-db
    environment:
      POSTGRES_USER: travel_user
      POSTGRES_PASSWORD: travel_password
      POSTGRES_DB: travel_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel_user -d travel_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: travel-ai-web
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://travel_user:travel_password@db:5432/travel_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
